name: 每月選股

on:
  schedule:
    - cron: "23 2 12 * *"    # 台灣時間每月 12 日 10:23（10 日月營收公布之後）
  workflow_dispatch:
    inputs:
      limit:
        description: "只檢查前 N 檔（測試用，留空＝全部）"
        required: false
      dry_run:
        description: "只看結果，不寫入 Notion"
        type: boolean
        default: false

permissions:
  contents: write   # 把每次的選股結果 CSV 存回 repo

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 340   # FinMind 免費額度有限速，全市場約需 2–4 小時
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 選股
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python screener.py $ARGS
      - name: 存下這次的名單
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add results/ || true
          git diff --cached --quiet || (git commit -m "選股結果 $(date +%F)" && git push)
