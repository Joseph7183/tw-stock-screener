name: 下載美股資料（009820 回測）

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      # 成分股名單 data/us/ndx_members.csv 已存在 repo，平常不再安裝第三方套件。
      # 要更新名單時，在自己電腦執行：pip install git+https://github.com/jmccarrell/n100tickers.git
      #                                python download_us.py --members-only
      - run: pip install -r requirements.txt yfinance
      - name: 下載股價與財報
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python -u download_us.py
      - name: 存檔
        if: always()
        run: bash .github/save_us.sh
