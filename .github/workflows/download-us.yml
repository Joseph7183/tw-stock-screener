name: 下載美股資料（009820 回測）

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: 安裝套件（成分股名單套件由 GitHub 原始碼安裝，使用者已同意）
        run: |
          pip install -r requirements.txt yfinance
          pip install "git+https://github.com/jmccarrell/n100tickers.git"
          python -c "import nasdaq_100_ticker_history as n; print(sorted(n.tickers_as_of(2020, 6, 1))[:5])"
      - name: 下載
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python -u download_us.py
      - name: 存檔
        if: always()
        run: bash .github/save_us.sh
