name: 下載美股資料（009820 回測）

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: 安裝套件（成分股名單套件由 GitHub 原始碼安裝，使用者已同意）
        run: |
          pip install -r requirements.txt yfinance
          pip install "git+https://github.com/jmccarrell/n100tickers.git"
          python -c "import nasdaq_100_ticker_history as n; print(sorted(n.tickers_as_of(2020, 6, 1))[:5])"
      - name: 下載
        run: python download_us.py
      - name: 存檔
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/us || true
          git diff --cached --quiet && exit 0
          git commit -q -m "美股資料 $(date +%F-%H%M)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
