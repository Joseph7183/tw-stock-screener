name: 下載美股資料（009820 回測）

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt yfinance nasdaq-100-ticker-history
      - name: 下載
        run: python download_us.py
      - name: 存檔
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/us || true
          git diff --cached --quiet && exit 0
          git commit -q -m "美股資料 $(date +%F-%H%M)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
