name: 下載回測資料

on:
  schedule:
    - cron: "37 */6 * * *"   # 每 6 小時接著抓一次，抓完後程式會直接結束
  workflow_dispatch:
    inputs:
      limit:
        description: "只抓前 N 檔（測試用，留空＝全部）"
        required: false

permissions:
  contents: write

concurrency:
  group: download-data   # 同一時間只跑一個，避免搶 FinMind 額度
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 檢查是否已經抓完
        id: check
        run: |
          if [ -f data/_progress.json ] && grep -q '"remaining": 0' data/_progress.json && [ -z "${{ inputs.limit }}" ]; then
            echo "done=true" >> $GITHUB_OUTPUT; echo "資料已經抓完，不用再跑"
          fi
      - name: 下載
        if: steps.check.outputs.done != 'true'
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          ARGS="--minutes 320"
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          python download_data.py $ARGS
      - name: 存檔
        if: always() && steps.check.outputs.done != 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/ || true
          git diff --cached --quiet && exit 0
          git commit -q -m "回測資料 $(date +%F-%H%M)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
